<!-- index.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courier Booking Form</title>
</head>
<body>
  <h1>Courier Booking Form</h1>
  <form action="/submit" method="POST">
    <label for="trackingId">Tracking ID:</label>
    <input type="text" id="trackingId" name="trackingId" value="C12345" required><br><br>

    <label for="senderName">Sender Name:</label>
    <input type="text" id="senderName" name="senderName" value="Thananya" required><br><br>

    <label for="receiverName">Receiver Name:</label>
    <input type="text" id="receiverName" name="receiverName" value="Devi" required><br><br>

    <label for="pickupAddress">Pickup Address:</label>
    <input type="text" id="pickupAddress" name="pickupAddress" value="Chennai" required><br><br>

    <label for="deliveryAddress">Delivery Address:</label>
    <input type="text" id="deliveryAddress" name="deliveryAddress" value="Bangalore" required><br><br>

    <label for="weight">Weight (kg):</label>
    <input type="number" id="weight" name="weight" required><br><br>

    <input type="submit" value="Book Courier">
  </form>
</body>
</html>
