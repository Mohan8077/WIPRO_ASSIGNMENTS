<!DOCTYPE html>
<html>
<head>
    <title>Quiz Game</title>
</head>
<body>
    <script>
        // Step 1: Welcome alert
        alert("Welcome to the Quiz Game!");

        // Step 2: Ask for user's name
        let name = prompt("What is your name?");

        // Step 3: Confirm quiz start
        let ready = confirm(`Hi ${name}, are you ready for the quiz?`);

        if (ready) {
            // Step 4: Multiple-choice question
            let answer = prompt(
                "Which planet is known as the Red Planet?\nA) Earth\nB) Mars\nC) Jupiter"
            );

            // Step 5: Check and display result
            if (answer.toLowerCase() === "b" || answer.toLowerCase() === "mars") {
                alert("Correct! Mars is the Red Planet.");
            } else {
                alert("Wrong! The correct answer is Mars.");
            }
        } else {
            alert("Okay! Maybe next time.");
        }
    </script>
</body>
</html>
